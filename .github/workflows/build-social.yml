name: Build Social (Twitter/Instagram)
on:
  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build APKs
        run: ./build.sh social.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
      
      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@morphedapps"
          
          X_VER=$(grep "Twitter" ../build.md | head -n1 | awk '{print $NF}')
          IG_VER=$(grep "Instagram" ../build.md | head -n1 | awk '{print $NF}')
          
          PATCH_TAG=$(curl -sL https://api.github.com/repos/crimera/piko/releases/latest | jq -r .tag_name)
          PATCH_VER=${PATCH_TAG#v}
          
          DL_BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"

          MSG="> **X and Instagram**

          \`x: ${X_VER:-N/A}\`
          \`instagram: ${IG_VER:-N/A}\`

          Install [Microg](https://github.com/MorpheApp/MicroG-RE/releases/tag/6.1.4) for non-root X and Instagram APKs
          Use [zygisk-detach](https://github.com/j-hc/zygisk-detach) to detach X and Instagram modules from Play Store

          [Piko changelog](https://github.com/crimera/piko/releases/tag/${PATCH_TAG})
          Piko patched - ${PATCH_VER}

          apk link"

          if [ -n "$X_VER" ] && [ "$X_VER" != "N/A" ]; then
            MSG="$MSG
          x - universal - [Download](${DL_BASE}/twitter-piko-v${X_VER}-universal.apk)"
          fi

          if [ -n "$IG_VER" ] && [ "$IG_VER" != "N/A" ]; then
            MSG="$MSG
          instagram - arm 64 V8a - [Download](${DL_BASE}/instagram-piko-v${IG_VER}-arm64-v8a.apk)
          instagram - arm 7 - [Download](${DL_BASE}/instagram-piko-v${IG_VER}-arm-v7a.apk)"
          fi

          MSG="$MSG

          [Myst25 chat for any discussion](https://t.me/+OQA0X-ECCHI4ZmU1)"

          MSG="$(echo "$MSG" | sed 's/^ \{10\}//')"
          
          echo "$MSG"
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "$POST"
